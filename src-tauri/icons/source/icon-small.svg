<!-- Drawn on a 32px grid for the tray and small shell sizes: no parentheses
     or blush, heavier strokes, tile fills the canvas. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9a3ff" />
      <stop offset="0.55" stop-color="#8b68fa" />
      <stop offset="1" stop-color="#6440e0" />
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="30" height="30" rx="7.5" fill="url(#tile)" />

  <g fill="none" stroke="#fff7f0" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7.5 12.5 Q10 16.5 12.5 12.5" stroke-width="2.6" />
    <path d="M19.5 12.5 Q22 16.5 24.5 12.5" stroke-width="2.6" />
    <path d="M11.5 19 Q13.75 23.5 16 19.8 Q18.25 23.5 20.5 19" stroke-width="2.3" />
  </g>
</svg>
