<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>kaomoji</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app" id="app">
      <header class="topbar">
        <input
          id="search"
          class="search"
          type="text"
          placeholder="Search kaomoji…"
          autocomplete="off"
          spellcheck="false"
        />
        <button class="dropdown-btn" id="categoryBtn" title="Filter by category (Ctrl+P)">
          <span class="dot" id="categoryDot"></span>
          <span id="categoryLabel">All Categories</span>
          <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4.5 6.5 8 10l3.5-3.5" />
          </svg>
        </button>
        <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
            <path d="M2 4.5h6.5M12.5 4.5H14M2 11.5h1.5M7.5 11.5H14" />
            <circle cx="10.5" cy="4.5" r="1.75" />
            <circle cx="5.5" cy="11.5" r="1.75" />
          </svg>
        </button>
      </header>

      <main class="content" id="content"></main>

      <footer class="actionbar">
        <div class="actionbar-left">
          <span class="app-icon" id="face">( ˘ω˘ )</span>
          <span class="context" id="context"></span>
        </div>
        <div class="actionbar-right">
          <button class="bar-btn" id="primaryBtn">
            <span id="primaryLabel">Copy</span>
            <kbd>↵</kbd>
          </button>
          <span class="bar-divider"></span>
          <button class="bar-btn" id="actionsBtn">
            <span>Actions</span>
            <kbd>Ctrl</kbd><kbd>K</kbd>
          </button>
        </div>
      </footer>

      <div class="popover" id="popover" hidden></div>

      <div class="settings-panel" id="settingsPanel" hidden>
        <header class="topbar settings-top">
          <button class="icon-btn back-btn" id="settingsBackBtn" title="Back (Esc)" aria-label="Back">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M13 8H3M7 4 3 8l4 4" />
            </svg>
          </button>
          <span class="settings-title">Settings</span>
        </header>

        <div class="settings-body">
          <label class="setting-row">
            <span class="setting-text">
              <span>Stay open after copying</span>
            </span>
            <span class="toggle">
              <input type="checkbox" id="stayOpenToggle" />
              <span class="toggle-track"><span class="toggle-thumb"></span></span>
            </span>
          </label>

          <label class="setting-row">
            <span class="setting-text">
              <span>Paste into the last app</span>
              <span class="setting-hint">Enter pastes directly and restores your clipboard. Ctrl+Enter still just copies.</span>
            </span>
            <span class="toggle">
              <input type="checkbox" id="autoPasteToggle" />
              <span class="toggle-track"><span class="toggle-thumb"></span></span>
            </span>
          </label>

          <label class="setting-row">
            <span class="setting-text"><span>Copy sound</span></span>
            <span class="toggle">
              <input type="checkbox" id="soundToggle" />
              <span class="toggle-track"><span class="toggle-thumb"></span></span>
            </span>
          </label>

          <label class="setting-row">
            <span class="setting-text"><span>Launch at startup</span></span>
            <span class="toggle">
              <input type="checkbox" id="autostartToggle" />
              <span class="toggle-track"><span class="toggle-thumb"></span></span>
            </span>
          </label>

          <div class="setting-row">
            <span class="setting-text"><span>Theme</span></span>
            <div class="segmented" id="themeSegmented">
              <button data-theme="auto" class="seg-btn">Auto</button>
              <button data-theme="light" class="seg-btn">Light</button>
              <button data-theme="dark" class="seg-btn">Dark</button>
            </div>
          </div>

          <div class="setting-row">
            <span class="setting-text">
              <span>Sync folder</span>
              <span class="setting-hint path" id="dataDirHint"></span>
            </span>
            <span class="row-buttons">
              <button class="small-btn" id="dataDirResetBtn" hidden>Use this PC</button>
              <button class="small-btn" id="dataDirBtn">Choose…</button>
            </span>
          </div>

          <div class="setting-row">
            <span class="setting-text">
              <span>Global hotkey</span>
              <span class="setting-hint" id="hotkeyHint"></span>
            </span>
            <button class="hotkey-btn" id="hotkeyBtn">…</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
