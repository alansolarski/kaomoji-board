name: Release

# Push a tag like v0.6.0 (matching the version in tauri.conf.json) to build,
# sign and publish a release. The app's updater reads latest.json from it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches the app version
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} doesn't match app version $version"
          }

      # No dependency caches: GitHub scopes caches to the ref that saved them,
      # and every release runs on a fresh tag, so they'd never be reused.
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "kaomoji board ${{ github.ref_name }}"
          releaseBody: "Download **kaomoji-board_*_x64-setup.exe** below and run it. Existing installs update themselves."
          releaseDraft: false
          prerelease: false
